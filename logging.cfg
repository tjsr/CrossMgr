[formatters]
keys=simple,method,trace,input,output

[handlers]
keys=console,file,decoderinput,decoderoutput

[loggers]
keys=root,UltraDecoderInput,UltraDecoderOutput

[formatter_simple]
format=%(asctime)s %(name)s [%(levelname)s] %(message)s

[formatter_method]
format=%(asctime)s %(name)s:%(funcName)s [%(levelname)s] %(message)s

[formatter_trace]
format=%(asctime)s %(name)s@%(filename)s:%(lineno)d:%(funcName)s [%(levelname)s] %(message)s

[formatter_input]
format=%(message)s

[formatter_output]
format='#%(message)s'

[handler_console]
class=logging.StreamHandler
formatter=simple
stream=ext://sys.stdout

[handler_file]
class=logging.FileHandler
formatter=method
args=('logs/crossmgr.log',)

[handler_decoderinput]
class=logging.FileHandler
formatter=input
args=('logs/decoder.log',)

[handler_decoderoutput]
class=logging.FileHandler
formatter=output
args=('logs/decoderout.log',)

[logger_UltraDecoderInput]
qualname=TimingDevice[UltraDecoder].input
level=INFO
handlers=decoderinput

[logger_UltraDecoderOutput]
qualname=TimingDevice[UltraDecoder].output
level=INFO
handlers=decoderoutput

[logger_root]
class=CrossMgrLogger
level=INFO
handlers=console,file
