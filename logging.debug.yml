version: 1

handlers:
  debugfile:
    '()': ext://Log.owned_file_handler
    formatter: method
    filename: 'logs/crossmgr-debug.log'
    mode: a
    encoding: utf-8
  console:
    class: logging.StreamHandler
    formatter: method
    stream: ext://sys.stdout
    filters:
      - UltraVoltageFilter

loggers:
  UltraDecoder.parse:
    level: WARNING
  root:
    level: DEBUG
    handlers:
    - console
    - file
    - debugfile
